<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architect Rush: SAA-C03 Practice</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#16191f;--mut:#5f6b7a;--line:#d5dbdb;--ac:#ED7100;--ok:#1d8102;--bad:#d13212;--grid:#e3e6ea;
        box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2d;--card:#16263d;--ink:#eef2f7;--mut:#9aa8bb;--line:#2c4160;--ok:#4fc423;--bad:#ff6a4d;--grid:#1d3150}}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  main{max-width:860px;margin:0 auto;padding:14px}
  h1{font:800 30px/1.1 Georgia,serif;margin:6px 0}
  .bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
  .bar span{white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
  button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:9px 16px;background:var(--ac);color:#111;cursor:pointer}
  button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible,.o:focus-visible,.n:focus-visible,.p:focus-visible{outline:3px solid #0972d3;outline-offset:2px}
  .t{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:8px}
  .t i{display:block;height:100%;background:var(--ac);transition:width 1s linear}
  #cv{position:relative;height:380px;border:1px solid var(--line);border-radius:8px;background-color:var(--card);
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:20px 20px;overflow:hidden;touch-action:none}
  #cv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .n{position:absolute;width:76px;text-align:center;font-size:11px;line-height:1.2;cursor:grab;user-select:none;touch-action:none;padding:3px;border-radius:6px}
  .n.s{outline:2px dashed #0972d3;background:rgba(9,114,211,.12)}
  .n i,.p i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 3px;border-radius:5px;color:#fff;font:700 13px/1 system-ui;font-style:normal}
  #pal{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .p{width:82px;text-align:center;font-size:11px;line-height:1.2;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:grab;touch-action:none;user-select:none}
  .gh{position:fixed;z-index:9;pointer-events:none;opacity:.85}
  .o{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-weight:500}
  .o.s{border-color:#0972d3;background:rgba(9,114,211,.12)}
  .o.ok{border-color:var(--ok);background:rgba(29,129,2,.15)}
  .o.no{border-color:var(--bad);background:rgba(209,50,18,.14)}
  .hint{color:var(--mut);font-size:13px}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .res{padding:0;margin:8px 0}.res li{list-style:none;margin:2px 0}
  .v{font:800 20px Georgia,serif}
  .ok{color:var(--ok)}.no{color:var(--bad)}
  .tip{border-left:4px solid var(--ac);padding:4px 10px;margin-top:10px;background:rgba(237,113,0,.09)}
  .bd{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin:3px 3px 0 0;font-size:13px}
  @media(prefers-reduced-motion:reduce){.t i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="bar"><h1>Architect Rush</h1><span class="hint">SAA-C03 · Core Infrastructure &amp; Networking</span></div>
  <div id="hud" class="bar card" hidden></div>
  <div id="app"></div>
</main>
<script>
/* ============================ CONFIG ============================ */
const STORAGE_KEY = 'saa-rush';
const ROUND_LENGTH = 0;           // questions per round (0 = use every item)
const MAX_EXTRA_LINES = 2;        // lines that match no expected link before a diagram fails
const MAX_HEARTS = 3;
const DIAGRAM_SECONDS = 100;
const CHOICE_SECONDS = 45;
const DECOY_COUNT = 6;            // number of non-duplicate decoy tiles drawn from T
const COMPUTE = ['ec2', 'asg'];   // EC2 and ASG are interchangeable
const LIGHT_TILES = ['#ED7100', '#7AA116'];

/* ===================== SERVICE TILES: key -> [label, color, short] ===================== */
const T = {
  // Compute
  ec2:['EC2','#ED7100','EC2'], asg:['Auto Scaling group','#ED7100','ASG'], lt:['Launch template','#ED7100','LT'],
  spot:['Spot Instances','#ED7100','SPT'], od:['On-Demand base','#ED7100','OD'],
  pg:['Cluster placement group','#ED7100','PG'], efa:['Elastic Fabric Adapter','#ED7100','EFA'],
  // Edge, DNS and load balancing
  r53:['Route 53','#8C4FFF','R53'], r53r:['Resolver inbound endpoint','#8C4FFF','RSV'],
  phz:['Private hosted zone','#8C4FFF','PHZ'], hc:['Route 53 health check','#8C4FFF','HC'],
  cf:['CloudFront','#8C4FFF','CF'], ga:['Global Accelerator','#8C4FFF','GA'],
  alb:['Application LB','#8C4FFF','ALB'], nlb:['Network LB','#8C4FFF','NLB'], tg:['Target group','#8C4FFF','TG'],
  gwlb:['Gateway Load Balancer','#8C4FFF','GWLB'], gwlbe:['GWLB endpoint','#8C4FFF','GWE'],
  appl:['Firewall appliance','#DD344C','FW'],
  // VPC networking
  vpc:['VPC','#8C4FFF','VPC'], pub:['Public subnet','#7AA116','PUB'], priv:['Private subnet','#3F8624','PRV'],
  az:['Availability Zone','#5f6b7a','AZ'], rtb:['Route table','#8C4FFF','RT'],
  igw:['Internet gateway','#8C4FFF','IGW'], nat:['NAT gateway','#8C4FFF','NAT'], eigw:['Egress-only IGW','#8C4FFF','EIG'],
  eip:['Elastic IP','#8C4FFF','EIP'], peer:['VPC peering','#8C4FFF','PCX'], tgw:['Transit gateway','#8C4FFF','TGW'],
  vpce:['S3 gateway endpoint','#8C4FFF','VPE'], pl:['Interface endpoint (PrivateLink)','#8C4FFF','PL'],
  fl:['VPC Flow Logs','#8C4FFF','FL'],
  // Hybrid
  onprem:['Corporate data center','#5f6b7a','DC'], users:['Users','#5f6b7a','USR'],
  vgw:['Virtual private GW','#8C4FFF','VGW'], vpn:['Site-to-Site VPN','#8C4FFF','VPN'],
  dx:['Direct Connect','#8C4FFF','DX'], dxgw:['Direct Connect gateway','#8C4FFF','DXGW'],
  // Security
  sg:['Security group','#DD344C','SG'], nacl:['Network ACL','#DD344C','ACL'], waf:['AWS WAF','#DD344C','WAF'],
  kms:['KMS key','#DD344C','KMS'], ram:['Resource Access Manager','#DD344C','RAM'],
  // Storage and data
  efs:['EFS','#3F8624','EFS'], efsia:['EFS Infrequent Access','#3F8624','IA'], ebs:['EBS volume','#3F8624','EBS'],
  snap:['EBS snapshot','#3F8624','SNAP'], s3:['S3','#3F8624','S3'], fsx:['FSx for Windows','#3F8624','FSx'],
  lus:['FSx for Lustre','#3F8624','FSxL'], rds:['RDS Multi-AZ','#3B48CC','RDS'],
  // Monitoring and messaging
  cw:['CloudWatch alarm','#E7157B','CW'], sqs:['SQS queue','#E7157B','SQS']
};

/* ============================ QUESTION DATA ============================
   D = diagram challenges. Fields:
     q    question text
     n    required nodes: { key: count }
     e    required links: [keyA, keyB, minCount = 1]
     tip  exam tip shown after grading
   Q = multiple choice. Fields: q, o (options), a (correct indexes), m (1 = choose two), tip   */

// ============================================================================
// TOPOLOGY DIAGRAM CHALLENGES (D)
// ============================================================================
const D = [
  {
    q: 'Highly available outbound IPv4 internet for private instances across two AZs without single points of failure.',
    n: { ec2: 2, priv: 2, nat: 2, pub: 2, igw: 1 },
    e: [['ec2', 'priv', 2], ['ec2', 'nat', 2], ['nat', 'pub', 2], ['nat', 'igw', 2]],
    tip: 'NAT Gateways are AZ-scoped. High availability requires 1 NAT Gateway per AZ in a public subnet, each routed to an IGW, with each private subnet route table pointing 0.0.0.0/0 to its respective AZ’s NAT GW.'
  },
  {
    q: 'Standard secure 3-tier architecture: public internet users enter via an Internet Gateway to an Application Load Balancer in public subnets, routing to an Auto Scaling fleet in private subnets, querying a private Multi-AZ database.',
    n: { users: 1, igw: 1, pub: 1, alb: 1, asg: 1, ec2: 1, priv: 1, rds: 1 },
    e: [['users', 'igw'], ['igw', 'alb'], ['alb', 'pub'], ['alb', 'asg'], ['asg', 'priv'], ['asg', 'ec2'], ['ec2', 'rds']],
    tip: 'Public subnets host only the internet-facing ALB. Compute (EC2/ASG) and database (RDS Multi-AZ) remain in private subnets with strict security group isolation between tiers.'
  },
  {
    q: 'Accelerate a static web app globally while ensuring the S3 origin bucket is completely private and accessible exclusively through CloudFront.',
    n: { users: 1, cf: 1, s3: 1 },
    e: [['users', 'cf'], ['cf', 's3']],
    tip: 'CloudFront with Origin Access Control (OAC) prevents direct S3 bucket access. S3 bucket policy allows read access only to the CloudFront distribution principal.'
  },
  {
    q: 'Serve dynamic REST API endpoints from private instances via a load balancer, and serve static images/assets from an S3 bucket, through a single CDN distribution.',
    n: { users: 1, cf: 1, alb: 1, ec2: 1, s3: 1 },
    e: [['users', 'cf'], ['cf', 'alb'], ['cf', 's3'], ['alb', 'ec2']],
    tip: 'CloudFront behaviors allow path-pattern routing (e.g., /api/* to ALB origin, and default/* to S3 origin) under a single SSL certificate and domain name.'
  },
  {
    q: 'A global multiplayer UDP/TCP game requires 2 static Anycast IP addresses and instant failover to regional fleets behind high-throughput Layer 4 load balancers.',
    n: { users: 1, ga: 1, nlb: 2, ec2: 2 },
    e: [['users', 'ga'], ['ga', 'nlb', 2], ['nlb', 'ec2', 2]],
    tip: 'AWS Global Accelerator provides 2 static Anycast IPs, rides the AWS backbone, and supports TCP/UDP for fast failover to NLB endpoints. CloudFront only caches HTTP/HTTPS.'
  },
  {
    q: 'Transparently inspect all incoming internet traffic entering the VPC using a fleet of third-party firewall appliances before traffic reaches the workload.',
    n: { users: 1, igw: 1, gwlb: 1, appl: 2, ec2: 1 },
    e: [['users', 'igw'], ['igw', 'gwlb'], ['gwlb', 'appl', 2], ['gwlb', 'ec2']],
    tip: 'Gateway Load Balancer (GWLB) operates at Layer 3/4 (GENEVE protocol on port 6081) to transparently route VPC traffic to inline virtual appliances without altering source IP headers.'
  },
  {
    q: 'EC2 instances in a private subnet must access Amazon S3 buckets privately, without using the internet, and at zero additional hourly cost.',
    n: { ec2: 1, priv: 1, rtb: 1, vpce: 1, s3: 1 },
    e: [['ec2', 'priv'], ['priv', 'rtb'], ['rtb', 'vpce'], ['vpce', 's3']],
    tip: 'Gateway VPC Endpoints (for S3 and DynamoDB only) are completely free and route traffic through a VPC route table prefix list entry. Interface Endpoints (PrivateLink) incur hourly and data charges.'
  },
  {
    q: 'Private EC2 instances must push messages to Amazon SQS privately without an internet gateway, NAT gateway, or public IPs.',
    n: { ec2: 1, priv: 1, pl: 1, sqs: 1 },
    e: [['ec2', 'priv'], ['priv', 'pl'], ['pl', 'sqs']],
    tip: 'SQS does not support Gateway Endpoints. An Interface VPC Endpoint (powered by AWS PrivateLink) creates an ENI inside your private subnet with a private IP.'
  },
  {
    q: 'A SaaS vendor in VPC 1 must expose its application service securely to customer consumers in VPC 2, where both VPCs share the exact same 10.0.0.0/16 CIDR.',
    n: { ec2: 1, nlb: 1, pl: 1, vpc: 2 },
    e: [['ec2', 'nlb'], ['nlb', 'vpc'], ['pl', 'vpc'], ['nlb', 'pl']],
    tip: 'VPC Peering fails with overlapping CIDRs. AWS PrivateLink (NLB on the service provider side + Interface Endpoint on the consumer side) connects isolated services across overlapping IP ranges.'
  },
  {
    q: 'Connect three VPCs and an on-premises data center over VPN so all can communicate with each other, avoiding the operational complexity of a full-mesh peering topology.',
    n: { vpc: 3, tgw: 1, vpn: 1, onprem: 1 },
    e: [['vpc', 'tgw', 3], ['tgw', 'vpn'], ['vpn', 'onprem']],
    tip: 'Transit Gateway functions as a cloud router supporting transitive routing across thousands of VPCs and VPN/Direct Connect connections, eliminating the N(N-1)/2 mesh overhead of peering.'
  },
  {
    q: 'Connect two VPCs with non-overlapping CIDRs across two different AWS Regions privately and at the lowest possible data transfer cost, ensuring routing tables are properly configured.',
    n: { vpc: 2, peer: 1, rtb: 2 },
    e: [['vpc', 'peer', 2], ['vpc', 'rtb', 2]],
    tip: 'Inter-Region VPC Peering is the simplest and most cost-effective way to link two VPCs directly. Both route tables must be explicitly updated with the peer’s CIDR.'
  },
  {
    q: 'Establish a single 10 Gbps Direct Connect physical connection from on-premises to access workloads hosted across VPCs located in two distinct AWS Regions.',
    n: { onprem: 1, dx: 1, dxgw: 1, vpc: 2 },
    e: [['onprem', 'dx'], ['dx', 'dxgw'], ['dxgw', 'vpc', 2]],
    tip: 'A Direct Connect Gateway (DXGW) is a global resource that links a Direct Connect connection (via Private VIFs) to Virtual Private Gateways in multiple AWS Regions.'
  },
  {
    q: 'Deploy high-availability hybrid connectivity to a VPC using a dedicated private link as primary, with an encrypted internet-based automatic failover link.',
    n: { onprem: 1, dx: 1, vpn: 1, vgw: 1, vpc: 1 },
    e: [['onprem', 'dx'], ['onprem', 'vpn'], ['dx', 'vgw'], ['vpn', 'vgw'], ['vgw', 'vpc']],
    tip: 'Direct Connect (primary) with Site-to-Site VPN (backup) attached to the same VGW delivers cost-effective resilience. BGP routes over DX automatically take precedence over VPN due to AS PATH length.'
  },
  {
    q: 'Corporate policy mandates that all traffic traveling over a dedicated Direct Connect link into a VPC must be cryptographically encrypted in transit with IPsec.',
    n: { onprem: 1, dx: 1, vpn: 1, vgw: 1, vpc: 1 },
    e: [['onprem', 'dx'], ['dx', 'vpn'], ['vpn', 'vgw'], ['vgw', 'vpc']],
    tip: 'Direct Connect is private but unencrypted by default. Establish a public VIF on Direct Connect and run an IPsec Site-to-Site VPN tunnel inside it to the VPC.'
  },
  {
    q: 'Interconnect two remote branch offices to each other and to an AWS VPC using existing internet connections, without backhauling traffic through corporate HQ.',
    n: { onprem: 2, vpn: 2, vgw: 1, vpc: 1 },
    e: [['onprem', 'vpn', 2], ['vpn', 'vgw', 2], ['vgw', 'vpc']],
    tip: 'AWS VPN CloudHub allows multiple Site-to-Site VPN connections to terminate on a single Virtual Private Gateway with BGP, enabling branch sites to communicate directly through AWS.'
  },
  {
    q: 'A central networking account owns the VPC and routing topology. Allow workload accounts in an AWS Organization to launch EC2 instances directly into the central private subnet.',
    n: { ram: 1, vpc: 1, priv: 1, ec2: 2 },
    e: [['ram', 'priv'], ['priv', 'vpc'], ['ec2', 'priv', 2]],
    tip: 'AWS Resource Access Manager (RAM) shares subnets across an AWS Organization. Workload owners manage their instances, while networking admins retain control of VPC CIDRs, subnets, and route tables.'
  },
  {
    q: 'On-premises servers must resolve private domain names hosted in a Route 53 Private Hosted Zone over an existing hybrid VPN.',
    n: { onprem: 1, vpn: 1, r53r: 1, vpc: 1, phz: 1 },
    e: [['onprem', 'vpn'], ['vpn', 'r53r'], ['r53r', 'vpc'], ['vpc', 'phz']],
    tip: 'Route 53 Resolver Inbound Endpoints deliver IP addresses in your VPC for on-premises DNS forwarders to query private records in AWS Private Hosted Zones.'
  },
  {
    q: 'EC2 instances in a VPC must query corporate internal domain names (corp.internal) hosted on data center DNS servers over a hybrid link.',
    n: { ec2: 1, vpc: 1, r53out: 1, vpn: 1, onprem: 1 },
    e: [['ec2', 'vpc'], ['vpc', 'r53out'], ['r53out', 'vpn'], ['vpn', 'onprem']],
    tip: 'Route 53 Resolver Outbound Endpoints and Resolver forwarding rules route DNS queries matching specific on-premises domains from AWS back to your data center DNS servers.'
  },
  {
    q: 'Protect an Application Load Balancer and its backend web instances against SQL injection and HTTP flood attacks directly at the AWS edge before traffic hits the VPC.',
    n: { users: 1, cf: 1, waf: 1, alb: 1, ec2: 1 },
    e: [['users', 'cf'], ['cf', 'waf'], ['cf', 'alb'], ['alb', 'ec2']],
    tip: 'AWS WAF attaches directly to CloudFront distributions to inspect, filter, and rate-limit HTTP/HTTPS traffic at edge locations worldwide, shielding the origin ALB and EC2 servers.'
  },
  {
    q: 'Direct web traffic to an Application Load Balancer, but automatically fail over DNS to a static error website hosted in Amazon S3 when ALB health checks fail.',
    n: { users: 1, r53: 1, hc: 1, alb: 1, s3: 1 },
    e: [['users', 'r53'], ['r53', 'alb'], ['r53', 's3'], ['hc', 'alb']],
    tip: 'Route 53 Failover routing requires a Health Check monitoring the primary ALB endpoint. If unhealthy, Route 53 routes incoming DNS queries to the secondary S3 website record.'
  },
  {
    q: 'Implement defense-in-depth in a public subnet: evaluate inbound traffic with a stateless network filter, then with a stateful host filter on the EC2 instance.',
    n: { pub: 1, nacl: 1, ec2: 1, sg: 1 },
    e: [['pub', 'nacl'], ['pub', 'ec2'], ['ec2', 'sg']],
    tip: 'NACLs are stateless subnet-level firewalls evaluating numbered allow/deny rules. Security Groups are stateful ENI-level firewalls with allow-only rules.'
  },
  {
    q: 'Allow network administrators on the public internet to securely SSH into private application instances via a dedicated bastion host located in a public subnet.',
    n: { users: 1, igw: 1, pub: 1, ec2: 2, priv: 1 },
    e: [['users', 'igw'], ['igw', 'ec2'], ['ec2', 'pub'], ['ec2', 'priv']],
    tip: 'The bastion EC2 host resides in the public subnet with an Elastic IP. The private instances’ security group permits SSH port 22 strictly from the bastion’s security group.'
  },
  {
    q: 'Two Linux EC2 instances in different Availability Zones require concurrent read-write access to a shared POSIX file system, secured by a dedicated security group.',
    n: { ec2: 2, efs: 1, sg: 1 },
    e: [['ec2', 'efs', 2], ['efs', 'sg'], ['ec2', 'sg', 2]],
    tip: 'Amazon EFS provides concurrent NFSv4 access across multiple AZs. EFS mount targets use security groups permitting inbound TCP port 2049 exclusively from the client instances.'
  },
  {
    q: 'Automatically move rarely accessed files on a shared Linux file system to a low-cost storage tier after 30 days of inactivity without disrupting client mount paths.',
    n: { ec2: 2, efs: 1, efsia: 1 },
    e: [['ec2', 'efs', 2], ['efs', 'efsia']],
    tip: 'EFS Lifecycle Management transparently transitions files unaccessed for N days to EFS Infrequent Access (IA), slashing storage costs while remaining accessible under the same POSIX mount.'
  },
  {
    q: 'Two Windows EC2 instances require a fully managed SMB shared file system integrated with Microsoft Active Directory and NTFS permissions.',
    n: { ec2: 2, fsx: 1 },
    e: [['ec2', 'fsx', 2]],
    tip: 'FSx for Windows File Server provides native SMB shares, Active Directory integration, and NTFS access control lists. EFS is POSIX/NFS for Linux only.'
  },
  {
    q: 'An HPC compute cluster requires a POSIX-compliant, sub-millisecond file system pre-loaded from an Amazon S3 dataset that can write back computation results.',
    n: { ec2: 2, lus: 1, s3: 1 },
    e: [['ec2', 'lus', 2], ['lus', 's3']],
    tip: 'FSx for Lustre is optimized for HPC and machine learning, offering native two-way synchronization with Amazon S3 data repositories and parallel processing throughput.'
  },
  {
    q: 'A tightly coupled scientific simulation requires OS-bypass networking and the absolute lowest inter-node network latency between EC2 instances.',
    n: { ec2: 2, pg: 1, efa: 2 },
    e: [['ec2', 'pg', 2], ['ec2', 'efa', 2]],
    tip: 'An Elastic Fabric Adapter (EFA) provides OS-bypass capability for MPI workloads. Pairing EFA with a Cluster Placement Group ensures physical rack proximity with ultra-low latency.'
  },
  {
    q: 'On-premises applications requiring low-latency local NFS file access must store and retain their primary data in Amazon S3 buckets.',
    n: { onprem: 1, sgw: 1, s3: 1 },
    e: [['onprem', 'sgw'], ['sgw', 's3']],
    tip: 'AWS Storage Gateway (S3 File Gateway) caches active files locally on-premises via NFS/SMB while persisting objects directly in Amazon S3 for durable, cost-effective storage.'
  },
  {
    q: 'Migrate an existing unencrypted production EBS volume to an encrypted EBS volume using customer-managed AWS KMS keys without data loss.',
    n: { ec2: 1, ebs: 1, snap: 1, kms: 1 },
    e: [['ec2', 'ebs'], ['ebs', 'snap'], ['snap', 'kms']],
    tip: 'You cannot encrypt an existing EBS volume in place. Take a snapshot, copy the snapshot while enabling KMS encryption, and restore a new encrypted volume from that copy.'
  },
  {
    q: 'Decouple background worker EC2 instances from API web servers, scaling the worker Auto Scaling fleet dynamically based on pending message volume.',
    n: { sqs: 1, cw: 1, asg: 1, ec2: 2 },
    e: [['ec2', 'sqs', 2], ['cw', 'sqs'], ['cw', 'asg'], ['asg', 'ec2', 2]],
    tip: 'Worker instances scale horizontally using CloudWatch Alarms monitoring the SQS metric ApproximateNumberOfMessagesVisible, decoupling workload surges from processing capacity.'
  },
  {
    q: 'Minimize compute expenses for a stateless web application by maintaining a baseline of guaranteed On-Demand instances combined with Spot Instances for demand spikes.',
    n: { alb: 1, asg: 1, od: 1, spot: 1 },
    e: [['alb', 'asg'], ['asg', 'od'], ['asg', 'spot']],
    tip: 'An ASG Mixed Instances Policy mixes On-Demand instances (guaranteed baseline availability) with Spot Instances (up to 90% discount for burst capacity) across multiple instance types.'
  },
  {
    q: 'Route global web users automatically to the AWS Region delivering the fastest response times, each running an independent Application Load Balancer and fleet.',
    n: { users: 1, r53: 1, alb: 2, ec2: 2 },
    e: [['users', 'r53'], ['r53', 'alb', 2], ['alb', 'ec2', 2]],
    tip: 'Route 53 Latency-Based Routing queries network latency measurements between client IPs and AWS Regions, routing users to the specific ALB target group with the lowest round-trip time.'
  }
];

// ============================================================================
// EXAM DECISION QUESTIONS (Q)
// ============================================================================
const Q = [
  {
    q: 'How many usable IPv4 addresses are available in a /24 VPC subnet?',
    o: ['256', '254', '251', '250'],
    a: [2],
    tip: 'AWS reserves 5 IP addresses in every subnet: Network (.0), VPC Router (.1), Amazon DNS (.2), Future Use (.3), and Broadcast (.255).'
  },
  {
    q: 'What are the minimum and maximum allowable IPv4 CIDR prefix lengths for an Amazon VPC?',
    o: ['/8 minimum, /24 maximum', '/16 minimum, /28 maximum', '/16 minimum, /32 maximum', '/20 minimum, /28 maximum'],
    a: [1],
    tip: 'A VPC IPv4 CIDR block can be between /16 (65,536 addresses) and /28 (16 addresses).'
  },
  {
    q: 'An EC2 web server allows inbound port 443 in its Security Group, and the subnet NACL allows inbound port 443. However, web clients time out. What is missing?',
    o: ['Outbound rule for ephemeral ports (1024-65535) in the NACL', 'Outbound rule for port 443 in the Security Group', 'An Elastic IP attached to the NACL', 'A NAT Gateway in the public subnet'],

/* ============================ HELPERS ============================ */
const $ = selector => document.querySelector(selector);
const shuffle = list => list.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

// Whole days since epoch in user's local timezone (immune to DST drift)
const localDay = ms => {
    const d = new Date(ms);
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
};

const tileText = key => LIGHT_TILES.includes(T[key][1]) ? '#111' : '#fff';
const tileHTML = key => `<i style="background:${T[key][1]};color:${tileText(key)}">${T[key][2]}</i>${T[key][0]}`;

// Ensure all nodes required in D exist in T
[...D].forEach(d => Object.keys(d.n).forEach(k => {
    if (!T[k]) { console.warn('Missing tile:', k); T[k] = [k.toUpperCase(), '#888', k.slice(0, 3).toUpperCase()]; }
}));

/* ============================ STORAGE ============================ */
const loadSave = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; } };
const writeSave = obj => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch (e) {} };

let state, timer;
let mode = loadSave().mode || 'all';
let nextNodeId = 0;

/* ============================ HOME / ROUND SETUP ============================ */
function showHome() {
    const save = loadSave(), badges = save.badges || [];
    $('#hud').hidden = true;
    $('#app').innerHTML = `
    <div class="card">
        <div class="v">Build it. Grade it. Don’t lose your hearts.</div>
        <p>Drag services onto the canvas (or press Enter on one), select two to draw a line, then submit. Chain correct answers for a combo up to x5.</p>
        <p class="hint">Streak: ${save.streak || 0} day(s) · Best score: ${save.best || 0} · ${MAX_HEARTS} hearts, timed rounds</p>
        <div>${badges.map(b => `<span class="bd">${b}</span>`).join('') || '<span class="hint">No badges yet</span>'}</div>
        <div class="row" id="modes">${[['all','All'],['d','Diagrams'],['mc','Multiple choice']]
            .map(([k, label]) => `<button class="${mode == k ? '' : 'g'}" data-mode="${k}">${label}</button>`).join('')}</div>
        <div class="row"><button id="go">Start round</button></div>
    </div>`;
    document.querySelectorAll('#modes button').forEach(btn => btn.onclick = () => {
        mode = btn.dataset.mode;
        const s = loadSave(); s.mode = mode; writeSave(s);
        showHome();
    });
    $('#go').onclick = startRound;
}

function startRound() {
    const save = loadSave(), today = localDay(Date.now());
    save.streak = save.last === today ? save.streak || 1 : save.last === today - 1 ? (save.streak || 0) + 1 : 1;
    save.last = today;
    writeSave(save);

    let items = [
        ...(mode != 'mc' ? D.map(d => ({ d })) : []),
        ...(mode != 'd' ? Q.map(m => ({ m })) : [])
    ];
    items = shuffle(items);
    if (ROUND_LENGTH) items = items.slice(0, ROUND_LENGTH);

    state = { hearts: MAX_HEARTS, xp: 0, combo: 1, index: 0, items, builds: 0, retry: false };
    $('#hud').hidden = false;
    showItem();
}

function renderHud() {
    $('#hud').innerHTML = `<span>${'❤️'.repeat(state.hearts) || '💔'}</span><span>XP ${state.xp}</span><span>Combo x${state.combo}</span><span>🔥 ${loadSave().streak || 1}-day streak</span>`;
}

/* ============================ SHOW ONE ITEM ============================ */
function showItem() {
    clearInterval(timer);
    if (!state.hearts || state.index >= state.items.length) return showEnd();
    renderHud();

    const item = state.items[state.index], d = item.d;
    Object.assign(state, { current: item, nodes: [], edges: [], selected: null, picks: [], retry: false });
    const seconds = d ? DIAGRAM_SECONDS : CHOICE_SECONDS;
    const label = d ? 'Build the architecture' : item.m.m ? 'Choose TWO' : 'Choose ONE';

    $('#app').innerHTML = `
    <div class="card">
        <div class="t"><i id="tb" style="width:100%"></i></div>
        <p><b>${label}</b> · ${state.index + 1}/${state.items.length}</p>
        <p>${d ? d.q : item.m.q}</p>
        <div id="body"></div>
        <div class="row">
            <button id="ck">${d ? 'Check architecture' : 'Submit'}</button>
            ${d ? '<button class="g" id="rm">Remove selected</button><button class="g" id="cl">Clear</button>' : ''}
        </div>
    </div>
    <div id="fb"></div>`;

    d ? buildDiagramUI(d) : buildChoiceUI(item.m);
    $('#ck').onclick = () => grade(false);

    let left = seconds;
    timer = setInterval(() => {
        left--;
        $('#tb').style.width = left / seconds * 100 + '%';
        if (left <= 0) { clearInterval(timer); grade(true); }
    }, 1000);
}

/* ---------------- multiple choice ---------------- */
function buildChoiceUI(m) {
    $('#body').innerHTML = m.o.map((text, k) => `<button class="o" data-k="${k}">${text}</button>`).join('');
    document.querySelectorAll('.o').forEach(btn => btn.onclick = () => {
        const k = +btn.dataset.k;
        if (m.m) state.picks = state.picks.includes(k) ? state.picks.filter(p => p != k) : [...state.picks, k];
        else state.picks = [k];
        document.querySelectorAll('.o').forEach((el, j) => el.classList.toggle('s', state.picks.includes(j)));
    });
}

/* ---------------- diagram builder ---------------- */
function buildDiagramUI(d) {
    const requiredKeys = Object.keys(d.n);
    const availableDecoys = Object.keys(T).filter(k => !requiredKeys.includes(k));
    const chosenDecoys = shuffle(availableDecoys).slice(0, DECOY_COUNT);
    const keys = shuffle([...requiredKeys, ...chosenDecoys]);

    $('#body').innerHTML = `
    <div id="cv"><svg id="sv"></svg></div>
    <div id="pal">${keys.map(k => `<div class="p" data-k="${k}" tabindex="0" role="button" aria-label="Add ${T[k][0]}">${tileHTML(k)}</div>`).join('')}</div>
    <p class="hint">Drag or tap to add. Select two nodes to draw or erase a line. Keyboard: Tab to a node, Enter selects it, Delete removes it.</p>
    <details class="hint"><summary>Connection rules</summary>
        1. Traffic: link each hop in order (users → DNS → CDN → LB → compute → data).<br>
        2. Placement: link a resource to its subnet. EC2 and ASG count the same.<br>
        3. Attachments (SG, NACL, route table, endpoint, KMS, health check, Elastic IP) link to what they protect or serve.<br>
        4. IGW links to the first public-facing resource behind it, not the subnet.<br>
        5. Hybrid: on-premises → VPN/DX → gateway → VPC.<br>
        6. Lines have no direction. Up to ${MAX_EXTRA_LINES} extra lines are tolerated; more fails the check.
    </details>`;

    document.querySelectorAll('.p').forEach(el => {
        el.onpointerdown = e => dragFromPalette(el, e);
        el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addNodeAuto(el.dataset.k); } };
    });
    $('#rm').onclick = removeSelected;
    $('#cl').onclick = () => { state.nodes.forEach(n => n.el.remove()); state.nodes = []; state.edges = []; state.selected = null; paint(); };
}

function dragFromPalette(tile, startEvent) {
    const key = tile.dataset.k, ghost = tile.cloneNode(true);
    ghost.className = 'p gh';
    document.body.appendChild(ghost);
    const place = ev => { ghost.style.left = ev.clientX - 41 + 'px'; ghost.style.top = ev.clientY - 30 + 'px'; };
    place(startEvent);
    let moved = false;

    const onMove = ev => {
        if (Math.hypot(ev.clientX - startEvent.clientX, ev.clientY - startEvent.clientY) > 6) moved = true;
        place(ev);
    };
    const finish = (ev, cancelled) => {
        removeEventListener('pointermove', onMove);
        removeEventListener('pointerup', onUp);
        removeEventListener('pointercancel', onCancel);
        ghost.remove();
        if (cancelled) return;
        const r = $('#cv').getBoundingClientRect();
        const inside = ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom;
        if (!moved) addNodeAuto(key);
        else if (inside) addNode(key, ev.clientX - r.left - 38, ev.clientY - r.top - 30);
    };
    const onUp = ev => finish(ev, false), onCancel = ev => finish(ev, true);
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onCancel);
}

function addNodeAuto(key) {
    const perRow = Math.max(1, Math.floor(($('#cv').clientWidth - 20) / 90));
    const i = state.nodes.length;
    addNode(key, 10 + (i % perRow) * 90, 10 + Math.floor(i / perRow) * 90);
}

function addNode(key, x, y) {
    const el = document.createElement('div');
    const node = { id: ++nextNodeId, k: key, x: 0, y: 0, el };
    el.className = 'n';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', T[key][0]);
    el.innerHTML = tileHTML(key);
    $('#cv').appendChild(el);
    state.nodes.push(node);
    clampTo(node, x, y);

    el.onpointerdown = e => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        const offX = e.clientX - node.x, offY = e.clientY - node.y;
        let dragged = false;
        el.onpointermove = ev => {
            if (Math.abs(ev.clientX - offX - node.x) + Math.abs(ev.clientY - offY - node.y) > 6) dragged = true;
            if (dragged) { clampTo(node, ev.clientX - offX, ev.clientY - offY); paint(); }
        };
        el.onpointerup = () => { el.onpointermove = null; if (!dragged) toggleSelect(node); };
        el.onpointercancel = () => { el.onpointermove = null; };
    };
    el.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelect(node); }
        else if (e.key === 'Delete' || e.key === 'Backspace') { state.selected = node.id; removeSelected(); }
    };
    paint();
}

function clampTo(node, x, y) {
    const cv = $('#cv');
    node.x = Math.min(cv.clientWidth - 76, Math.max(0, x));
    node.y = Math.min(cv.clientHeight - 70, Math.max(0, y));
}

function toggleSelect(node) {
    if (state.selected == null || state.selected == node.id) {
        state.selected = state.selected == node.id ? null : node.id;
    } else {
        const a = state.selected;
        const existing = state.edges.findIndex(e => e.includes(a) && e.includes(node.id));
        existing >= 0 ? state.edges.splice(existing, 1) : state.edges.push([a, node.id]);
        state.selected = null;
    }
    paint();
}

function removeSelected() {
    const id = state.selected;
    if (id == null) return;
    state.nodes = state.nodes.filter(n => { if (n.id == id) n.el.remove(); return n.id != id; });
    state.edges = state.edges.filter(e => !e.includes(id));
    state.selected = null;
    paint();
}

function paint() {
    state.nodes.forEach(n => {
        n.el.style.left = n.x + 'px';
        n.el.style.top = n.y + 'px';
        n.el.classList.toggle('s', n.id == state.selected);
    });
    const find = id => state.nodes.find(n => n.id == id);
    $('#sv').innerHTML = state.edges.map(([ia, ib]) => {
        const a = find(ia), b = find(ib);
        return `<line x1="${a.x + 38}" y1="${a.y + 26}" x2="${b.x + 38}" y2="${b.y + 26}" stroke="#ED7100" stroke-width="2.5" stroke-linecap="round"/>`;
    }).join('');
}

/* ============================ GRADING ============================ */
const kindsFor = (a, b) => COMPUTE.includes(a) && !COMPUTE.includes(b) ? COMPUTE : [a];

function lineMatches(kx, ky, [a, b]) {
    const A = kindsFor(a, b), B = kindsFor(b, a);
    return (A.includes(kx) && B.includes(ky)) || (A.includes(ky) && B.includes(kx));
}

function gradeDiagram(d) {
    const items = [];
    let ok = true;
    const counts = {};
    state.nodes.forEach(n => counts[n.k] = (counts[n.k] || 0) + 1);

    // Compute interchangeability handling for node counts
    const isCompute = k => COMPUTE.includes(k);
    let totalReqCompute = 0;
    for (const k in d.n) if (isCompute(k)) totalReqCompute += d.n[k];
    let totalPlacedCompute = 0;
    COMPUTE.forEach(k => totalPlacedCompute += (counts[k] || 0));

    // 1. Required nodes
    let computeEvaluated = false;
    for (const k in d.n) {
        if (isCompute(k)) {
            if (!computeEvaluated) {
                const have = totalPlacedCompute >= totalReqCompute;
                ok = ok && have;
                if (!have) items.push([false, `Missing compute instances (need ${totalReqCompute} EC2 or ASG)`]);
                computeEvaluated = true;
            }
        } else {
            const have = (counts[k] || 0) >= d.n[k];
            ok = ok && have;
            if (!have) items.push([false, `Missing ${T[k][0]}${d.n[k] > 1 ? ' (need ' + d.n[k] + ')' : ''}`]);
        }
    }

    // 2. Extra/Decoy or over-placed nodes
    let computeOverEvaluated = false;
    for (const k in counts) {
        if (isCompute(k)) {
            if (!computeOverEvaluated) {
                if (totalReqCompute === 0) {
                    ok = false;
                    items.push([false, `Compute nodes do not belong in this design`]);
                } else if (totalPlacedCompute > totalReqCompute) {
                    ok = false;
                    items.push([false, `Too many compute nodes (placed ${totalPlacedCompute}, need ${totalReqCompute})`]);
                }
                computeOverEvaluated = true;
            }
        } else if (!d.n[k]) {
            ok = false;
            items.push([false, `${T[k] ? T[k][0] : k} does not belong in this design`]);
        } else if (counts[k] > d.n[k]) {
            ok = false;
            items.push([false, `Too many ${T[k][0]} (placed ${counts[k]}, need ${d.n[k]})`]);
        }
    }

    // 3. Required links
    const drawn = state.edges.map(([ia, ib]) => [
        state.nodes.find(n => n.id == ia).k,
        state.nodes.find(n => n.id == ib).k
    ]);
    d.e.forEach(([a, b, need = 1]) => {
        const have = drawn.filter(([kx, ky]) => lineMatches(kx, ky, [a, b])).length >= need;
        ok = ok && have;
        items.push([have, `${T[a][0]} ↔ ${T[b][0]}${need > 1 ? ' x' + need : ''}`]);
    });

    // 4. Anti-spam: lines that satisfy no expected link
    const extras = drawn.filter(([kx, ky]) => !d.e.some(exp => lineMatches(kx, ky, exp))).length;
    if (extras > MAX_EXTRA_LINES) {
        ok = false;
        items.push([false, `Too many unnecessary lines (${extras}). Remove lines that do not match a real route or attachment`]);
    }
    return { ok, items };
}

function gradeChoice(m) {
    const ok = m.a.length == state.picks.length && m.a.every(k => state.picks.includes(k));
    document.querySelectorAll('.o').forEach((el, j) => {
        el.disabled = true;
        el.classList.toggle('ok', m.a.includes(j));
        el.classList.toggle('no', state.picks.includes(j) && !m.a.includes(j));
    });
    return { ok, items: [] };
}

function grade(timedOut) {
    clearInterval(timer);
    const item = state.current, d = item.d;
    const result = d ? gradeDiagram(d) : gradeChoice(item.m);
    const ok = result.ok && !timedOut;
    const wasRetry = state.retry;
    let message;

    if (wasRetry) {
        message = ok ? 'Correct on the retry. No XP or combo' : 'Not yet. Adjust and recheck, no further penalty';
        if (ok) state.retry = false;
    } else if (ok) {
        const gain = (d ? 150 : 100) * state.combo;
        state.xp += gain;
        state.combo = Math.min(5, state.combo + 1);
        if (d) state.builds++;
        message = `Correct! +${gain} XP`;
    } else {
        state.hearts--;
        state.combo = 1;
        state.retry = !!d && state.hearts > 0 && !timedOut;
        message = timedOut ? 'Time’s up. −1 heart' : 'Not quite. −1 heart';
    }

    const newBadges = awardBadges();
    renderHud();
    if (!state.retry) state.index++;

    const buttonLabel = state.retry ? 'Skip this one' : state.hearts && state.index < state.items.length ? 'Next challenge' : 'See results';
    $('#fb').innerHTML = `
    <div class="card">
        <div class="v ${ok ? 'ok' : 'no'}">${message}</div>
        <ul class="res">${result.items.map(([hit, text]) => `<li class="${hit ? 'ok' : 'no'}">${hit ? '✔' : '✘'} ${text}</li>`).join('')}</ul>
        <div class="tip"><b>Exam tip:</b> ${(d || item.m).tip}</div>
        ${newBadges.map(b => `<span class="bd">New badge: ${b}</span>`).join('')}
        <div class="row"><button id="nx" class="${state.retry ? 'g' : ''}">${buttonLabel}</button></div>
    </div>`;

    $('#ck').disabled = !state.retry;
    $('#nx').onclick = state.retry ? () => { state.index++; showItem(); } : showItem;
    if (!state.retry) $('#nx').focus();

    // Restart countdown for diagram retries
    if (state.retry) {
        let left = DIAGRAM_SECONDS;
        $('#tb').style.width = '100%';
        timer = setInterval(() => {
            left--;
            $('#tb').style.width = left / DIAGRAM_SECONDS * 100 + '%';
            if (left <= 0) { clearInterval(timer); grade(true); }
        }, 1000);
    }

    $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function awardBadges() {
    const save = loadSave(), fresh = [];
    save.badges = save.badges || [];
    const award = (condition, name) => { if (condition && !save.badges.includes(name)) { save.badges.push(name); fresh.push(name); } };
    award(state.combo >= 5, '🔥 On Fire (x5 combo)');
    award(state.builds >= 3, '🏗️ Architect (3 builds)');
    award((save.streak || 0) >= 3, '📅 Regular (3-day streak)');
    save.best = Math.max(save.best || 0, state.xp);
    writeSave(save);
    return fresh;
}

/* ============================ END SCREEN ============================ */
function showEnd() {
    const save = loadSave();
    $('#app').innerHTML = `
    <div class="card">
        <div class="v">${state.hearts ? 'Round complete' : 'Out of hearts'}</div>
        <p>Score: <b>${state.xp} XP</b> · Best: ${save.best || 0}</p>
        <p class="hint">${state.hearts ? 'Run it again for a fresh set of questions and push for x5.' : 'Review the tips above, then try again.'}</p>
        <div class="row"><button id="go">Play again</button><button class="g" id="hm">Home</button></div>
    </div>`;
    $('#go').onclick = startRound;
    $('#hm').onclick = showHome;
}

showHome();
</script></body></html>
